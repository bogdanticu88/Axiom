# Manual, opt-in: the real GitHub Issues integration test (tests/integration/test_github_issues_optin.py).
# Runs only when dispatched by hand, and only after a required reviewer approves the protected environment
# "github-issues-integration". The token is that environment's secret AXIOM_TEST_GITHUB_TOKEN: it is written to a
# 0600 file and read by the platform through secretref:file/, never passed to the test as an environment variable.
# The target repository is the environment variable AXIOM_TEST_GITHUB_REPO; the test refuses one that is not private.
# Actions are pinned to the same full commit hashes as ci.yml (ADR 0007).
name: github-issues-optin
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "normal (creates 4 issues, then closes them), readonly (token edited to Issues read-only), revoked (token deleted)"
        required: true
        type: choice
        options: [normal, readonly, revoked]
permissions:
  contents: read
concurrency:
  group: github-issues-optin
  cancel-in-progress: false
jobs:
  optin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: github-issues-integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv and PostgreSQL 16 server
        run: |
          python -m pip install "uv==0.11.32"
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          sudo systemctl stop postgresql || true
          uv sync --frozen
      - name: Write the token to a private file
        env:
          TOKEN: ${{ secrets.AXIOM_TEST_GITHUB_TOKEN }}
        run: |
          test -n "$TOKEN" || { echo "AXIOM_TEST_GITHUB_TOKEN is not set in the environment"; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/axiom-secrets"
          printf '%s' "$TOKEN" > "$RUNNER_TEMP/axiom-secrets/github-token"
      - name: Run the opt-in test
        env:
          AXIOM_TEST_GITHUB_REPO: ${{ vars.AXIOM_TEST_GITHUB_REPO }}
          AXIOM_TEST_GITHUB_MODE: ${{ inputs.mode }}
        run: |
          test -n "$AXIOM_TEST_GITHUB_REPO" || { echo "AXIOM_TEST_GITHUB_REPO is not set in the environment"; exit 1; }
          mkdir -p .var/optin
          sudo -E env "PATH=$PATH" bash -c '
            set -o pipefail
            scripts/dev/test-db.sh start
            set -a; . ./.env.test; set +a
            AXIOM_TEST_GITHUB_ISSUES=1 AXIOM_TEST_GITHUB_TOKEN_FILE="$RUNNER_TEMP/axiom-secrets/github-token" \
              uv run --frozen pytest -rA -s -p no:cacheprovider tests/integration/test_github_issues_optin.py \
              2>&1 | tee .var/optin/pytest.log'
      - name: Check the log does not contain the token
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/axiom-secrets/github-token" ] && [ -f .var/optin/pytest.log ] \
             && sudo grep -qF -f "$RUNNER_TEMP/axiom-secrets/github-token" .var/optin/pytest.log; then
            echo "the token appears in the test log; not uploading it"; sudo rm -f .var/optin/pytest.log; exit 1
          fi
          rm -f "$RUNNER_TEMP/axiom-secrets/github-token"
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-issues-optin-${{ inputs.mode }}
          path: .var/optin/
          if-no-files-found: ignore
          retention-days: 14
