    { name = "authlib" },
    { name = "boto3" },
    { name = "fastapi" },
    { name = "httpx" },
    { name = "psycopg", extra = ["binary"] },
    { name = "psycopg-pool" },
    { name = "pydantic" },
    { name = "pydantic-settings" },
    { name = "pyjwt", extra = ["crypto"] },
    { name = "uvicorn" },
]

[package.dev-dependencies]
dev = [
    { name = "playwright" },
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "authlib", specifier = ">=1.8.0" },
    { name = "boto3" },
    { name = "fastapi" },
    { name = "httpx" },
    { name = "psycopg", extras = ["binary"] },
    { name = "psycopg-pool" },
    { name = "pydantic" },
    { name = "pydantic-settings" },
    { name = "pyjwt", extras = ["crypto"] },
    { name = "uvicorn" },
]

[package.metadata.requires-dev]
dev = [
    { name = "playwright", specifier = "==1.56.0" },
    { name = "pytest" },
]
