# Single-host installation for development and evaluation with SYNTHETIC data.
#
#   cp deployments/compose/.env.example deployments/compose/.env   # then set real secrets
#   docker compose -f deployments/compose/compose.yaml --env-file deployments/compose/.env up -d --build
#   open http://127.0.0.1:${AXIOM_API_PORT}/ui/ and sign in as alice (password: AXIOM_DEMO_PASSWORD)
#
# Not a production profile: a local Keycloak in development mode (H2 storage, HTTP, synthetic users), development
# bearer tokens (inline JWKS from a generated key), a single PostgreSQL instance, single-node object storage, no TLS
# termination. The API refuses inline JWKS, plain-HTTP identity URLs, insecure cookies, the environment secret
# resolver (production needs secretref:file/ mounted secrets) and filesystem storage when AXIOM_ENV=production.
# See docs/INSTALL-COMPOSE.md and docs/DEPLOYMENT-TRUST-BOUNDARY.md.
name: axiom

x-backend: &backend
  image: axiom-backend:dev
  build:
    context: ../..
    dockerfile: Dockerfile
  environment: &backend-env
    AXIOM_ENV: development
    AXIOM_LOG_LEVEL: INFO
    AWS_ACCESS_KEY_ID: ${AXIOM_S3_ACCESS_KEY:?set AXIOM_S3_ACCESS_KEY}
    AWS_SECRET_ACCESS_KEY: ${AXIOM_S3_SECRET_KEY:?set AXIOM_S3_SECRET_KEY}

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16.15@sha256:a902560563d3a5661228585f53474c5065e7f273b21ffd77e555a8b5682c5690
    environment:
      POSTGRES_PASSWORD: ${AXIOM_PG_SUPERUSER_PASSWORD:?set AXIOM_PG_SUPERUSER_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  objects:
    image: mirror.gcr.io/chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/axiom/s3.json", "-ip.bind=0.0.0.0"]
    entrypoint: ["/bin/sh", "-c", "sed -e \"s/__ACCESS__/$$AXIOM_S3_ACCESS_KEY/\" -e \"s/__SECRET__/$$AXIOM_S3_SECRET_KEY/\" /etc/axiom/s3.template.json > /etc/axiom/s3.json && exec /entrypoint.sh \"$$@\"", "--"]
    environment:
      AXIOM_S3_ACCESS_KEY: ${AXIOM_S3_ACCESS_KEY}
      AXIOM_S3_SECRET_KEY: ${AXIOM_S3_SECRET_KEY}
    volumes:
      - objdata:/data
      - ./seaweedfs/s3.template.json:/etc/axiom/s3.template.json:ro
      - objcfg:/etc/axiom
    networks: [data]

  # One-shot: cluster roles and the application database (runs as the PostgreSQL superuser).
  db-init:
    image: public.ecr.aws/docker/library/postgres:16.15@sha256:a902560563d3a5661228585f53474c5065e7f273b21ffd77e555a8b5682c5690
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${AXIOM_PG_SUPERUSER_PASSWORD}
      AXIOM_MIGRATOR_PASSWORD: ${AXIOM_MIGRATOR_PASSWORD:?set AXIOM_MIGRATOR_PASSWORD}
      AXIOM_APP_PASSWORD: ${AXIOM_APP_PASSWORD:?set AXIOM_APP_PASSWORD}
      AXIOM_RELAY_PASSWORD: ${AXIOM_RELAY_PASSWORD:?set AXIOM_RELAY_PASSWORD}
      AXIOM_ADMIN_CLI_PASSWORD: ${AXIOM_ADMIN_CLI_PASSWORD:?set AXIOM_ADMIN_CLI_PASSWORD}
    volumes:
      - ../../db:/axiom/db:ro
      - ./init/db-init.sh:/axiom/db-init.sh:ro
    entrypoint: ["sh", "/axiom/db-init.sh"]
    restart: "no"
    networks: [data]

  # One-shot: migrations (as axiom_migrator), development identity keys, synthetic seed, bucket.
  app-init:
    <<: *backend
    depends_on:
      db-init: {condition: service_completed_successfully}
      objects: {condition: service_started}
    environment:
      <<: *backend-env
      AXIOM_MIGRATOR_DSN: host=postgres dbname=axiom user=axiom_migrator password=${AXIOM_MIGRATOR_PASSWORD}
      AXIOM_ADMIN_DSN: host=postgres dbname=axiom user=axiom_admin_cli password=${AXIOM_ADMIN_CLI_PASSWORD}
      AXIOM_APP_DSN_SEED: host=postgres dbname=axiom user=axiom_app password=${AXIOM_APP_PASSWORD}
      AXIOM_S3_ENDPOINT_URL: http://objects:8333
      AXIOM_S3_BUCKET: axiom-evidence
    volumes:
      - devidp:/var/lib/axiom/dev-idp
      - ./init/app-init.sh:/axiom/app-init.sh:ro
    user: "0:0"   # only to set ownership of the dev-idp volume; drops to uid 10001 for all work
    entrypoint: ["sh", "/axiom/app-init.sh"]
    restart: "no"
    networks: [data]

  # One-shot: the local identity provider's realm (synthetic users) and the mapping of its subjects to the seeded
  # principals (by issuer and subject; never by email).
  idp-init:
    <<: *backend
    depends_on:
      app-init: {condition: service_completed_successfully}
    environment:
      <<: *backend-env
      AXIOM_ADMIN_DSN: host=postgres dbname=axiom user=axiom_admin_cli password=${AXIOM_ADMIN_CLI_PASSWORD}
      AXIOM_OIDC_ISSUER: http://127.0.0.1:${AXIOM_IDP_PORT:-8081}/realms/axiom
      AXIOM_PUBLIC_ORIGIN: http://127.0.0.1:${AXIOM_API_PORT:-8000}
      AXIOM_OIDC_CLIENT_SECRET: ${AXIOM_OIDC_CLIENT_SECRET:?set AXIOM_OIDC_CLIENT_SECRET}
      AXIOM_DEMO_PASSWORD: ${AXIOM_DEMO_PASSWORD:?set AXIOM_DEMO_PASSWORD}
    volumes:
      - idpimport:/var/lib/axiom/idp-import
    user: "0:0"   # only to set ownership of the import volume; drops to uid 10001 for all work
    entrypoint: ["sh", "-c", "chown 10001 /var/lib/axiom/idp-import && exec setpriv --reuid=10001 --regid=10001 --clear-groups sh -eu -c 'python -m axiom.devidp realm --out /var/lib/axiom/idp-import && python -m axiom.devidp link --admin-dsn \"$$AXIOM_ADMIN_DSN\"'"]
    restart: "no"
    networks: [data]

  # Local identity provider for the development profile (Keycloak 26.4.2 in dev mode, pinned by digest). The browser
  # reaches it on 127.0.0.1:${AXIOM_IDP_PORT}; the API reaches it on the container network (backchannel).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2@sha256:3617b09bb4b7510a8d8d9b9fc5707399e2d70688dbcc2f8fb013a144829be1b9
    depends_on:
      idp-init: {condition: service_completed_successfully}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://127.0.0.1:${AXIOM_IDP_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - idpimport:/opt/keycloak/data/import:ro
    ports: ["127.0.0.1:${AXIOM_IDP_PORT:-8081}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 60
    networks: [edge]

  api:
    <<: *backend
    depends_on:
      app-init: {condition: service_completed_successfully}
      keycloak: {condition: service_started}
    environment:
      <<: *backend-env
      AXIOM_DATABASE_DSN: host=postgres dbname=axiom user=axiom_app password=${AXIOM_APP_PASSWORD}
      AXIOM_OBJECT_STORE: s3
      AXIOM_S3_ENDPOINT_URL: http://objects:8333
      AXIOM_S3_BUCKET: axiom-evidence
      AXIOM_TRUSTED_ISSUERS_FILE: /var/lib/axiom/dev-idp/issuers.json
      # analyst UI and sign-in through the local Keycloak (ADR 0013)
      AXIOM_UI_DIST_DIR: /app/ui
      AXIOM_OIDC_ISSUER: http://127.0.0.1:${AXIOM_IDP_PORT:-8081}/realms/axiom
      AXIOM_OIDC_METADATA_URL: http://keycloak:8080/realms/axiom/.well-known/openid-configuration
      AXIOM_OIDC_CLIENT_ID: axiom-ui
      AXIOM_OIDC_CLIENT_SECRET_REF: secretref:env/AXIOM_OIDC_CLIENT_SECRET
      AXIOM_OIDC_CLIENT_SECRET: ${AXIOM_OIDC_CLIENT_SECRET}
      AXIOM_OIDC_REDIRECT_URI: http://127.0.0.1:${AXIOM_API_PORT:-8000}/auth/callback
      AXIOM_OIDC_POST_LOGOUT_REDIRECT_URI: http://127.0.0.1:${AXIOM_API_PORT:-8000}/ui/
      AXIOM_UI_COOKIE_SECURE: "false"     # plain HTTP on loopback in this profile; production refuses this
    volumes:
      - devidp:/var/lib/axiom/dev-idp:ro
    entrypoint: ["sh", "-c", "export AXIOM_TRUSTED_ISSUERS_JSON=\"$$(cat $$AXIOM_TRUSTED_ISSUERS_FILE)\" && exec python -m axiom.server"]
    ports: ["127.0.0.1:${AXIOM_API_PORT:-8000}:8000"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [data, edge]

  # Job worker (ADR 0006): ingestion runs, action executions, risk sweeps. Same image, runtime DB role, no inbound
  # ports. The restore witness (ADR 0010) is on its own volume, separate from pgdata; in production it must be in a
  # different backup domain from the database.
  job-worker:
    <<: *backend
    depends_on:
      app-init: {condition: service_completed_successfully}
    environment:
      <<: *backend-env
      AXIOM_DATABASE_DSN: host=postgres dbname=axiom user=axiom_app password=${AXIOM_APP_PASSWORD}
      AXIOM_OBJECT_STORE: s3
      AXIOM_S3_ENDPOINT_URL: http://objects:8333
      AXIOM_S3_BUCKET: axiom-evidence
      AXIOM_TRUSTED_ISSUERS_FILE: /var/lib/axiom/dev-idp/issuers.json
      AXIOM_RESTORE_WITNESS: dir:/var/lib/axiom/witness
    volumes:
      - devidp:/var/lib/axiom/dev-idp:ro
      - witness:/var/lib/axiom/witness
    entrypoint: ["sh", "-c", "export AXIOM_TRUSTED_ISSUERS_JSON=\"$$(cat $$AXIOM_TRUSTED_ISSUERS_FILE)\" && exec python -m axiom.workers.jobs --interval 3"]
    healthcheck: {disable: true}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [data]

volumes:
  pgdata: {}
  objdata: {}
  objcfg: {}
  devidp: {}
  idpimport: {}
  witness: {}

networks:
  data: {internal: true}
  edge: {}
